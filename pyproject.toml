[project]
name = "hello-lang-graph"
version = "0.1.0"
description = "自分専用常駐AIエージェント ハンズオン"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "ddgs>=9.11.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
"exercises/*" = ["ANN001", "ANN201", "ANN202"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
